name: Update A-share market snapshot

on:
  schedule:
    # 北京时间 17:17 首轮更新，18:17 仅在首轮未成功时补跑。
    - cron: '17 9 * * 1-5'
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-state-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore source and persistent state
        shell: bash
        run: |
          rm -rf cloud-source
          python -m zipfile -e cloud-source.zip cloud-source
          if [ -d state ]; then rm -rf cloud-source/state && cp -R state cloud-source/state; fi
          if [ -d public ]; then rm -rf cloud-source/public && cp -R public cloud-source/public; fi

      - name: Install historical backtest dependency
        shell: bash
        run: python -m pip install --quiet numpy

      - name: Generate and validate latest snapshot
        shell: bash
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if python -c 'import json, sys; from datetime import datetime; from pathlib import Path; from zoneinfo import ZoneInfo; p=Path("cloud-source/public/data/market-state.json"); m=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; today=datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y-%m-%d"); fresh=m.get("trade_date")==today and m.get("data_status")=="complete"; print(f"今天({today})完整快照已存在，跳过补跑。" if fresh else "今天尚无完整快照，继续更新。"); sys.exit(0 if fresh else 1)'; then
              exit 0
            fi
          fi
          python cloud-source/scripts/cloud_update.py ${{ github.event_name == 'schedule' && '--scheduled' || '' }}

      - name: Save persistent state and public snapshots
        shell: bash
        run: |
          rm -rf state public
          cp -R cloud-source/state state
          cp -R cloud-source/public public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state public
          if ! git diff --cached --quiet; then
            git commit -m "Update market snapshot"
            git push
          fi
